name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY=AIzaSyCMah3lL8rFs9UNq2g42XzFm_PQS-sMs6o
          VITE_FIREBASE_AUTH_DOMAIN=skin1004-react.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=skin1004-react
          VITE_FIREBASE_STORAGE_BUCKET=skin1004-react.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=560747530681
          VITE_FIREBASE_APP_ID=1:560747530681:web:578f58f68695bdb676ce68
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4